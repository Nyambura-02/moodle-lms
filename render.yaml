services:
  - type: web
    name: globecon-moodle-lms
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile
    healthCheckPath: /login/index.php
    envVars:
      - key: DB_TYPE
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: globecon-moodle-db
          property: connectionString
      - key: DEFAULT_THEME
        value: globecon
    disk:
      name: moodledata-volume
      mountPath: /var/www/moodledata
      sizeGB: 10

databases:
  - name: globecon-moodle-db
    databaseName: moodle
    user: moodleuser
    plan: starter
