<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 84" width="480" height="84">
  <defs>
    <!-- Purple to Blue Network Gradients -->
    <linearGradient id="globeMeshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="globeNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="globeTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- GlobeCon Official Spherical Network Mesh Icon -->
  <g transform="translate(10, 6)">
    <!-- Base Circular Aura -->
    <circle cx="36" cy="36" r="34" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" />
    
    <!-- Spherical Network Wireframe & Longitudes -->
    <!-- Outer perimeter ring -->
    <circle cx="36" cy="36" r="31" fill="none" stroke="url(#globeMeshGrad)" stroke-width="2" />
    
    <!-- Vertical ellipses (longitudes) -->
    <ellipse cx="36" cy="36" rx="12" ry="31" fill="none" stroke="#7c3aed" stroke-width="1.4" opacity="0.85" />
    <ellipse cx="36" cy="36" rx="22" ry="31" fill="none" stroke="#8b5cf6" stroke-width="1.3" opacity="0.75" />
    
    <!-- Horizontal latitudinal arcs -->
    <path d="M 6,36 Q 36,22 66,36" fill="none" stroke="#2563eb" stroke-width="1.4" opacity="0.8" />
    <path d="M 6,36 Q 36,50 66,36" fill="none" stroke="#2563eb" stroke-width="1.4" opacity="0.8" />
    <path d="M 12,23 Q 36,13 60,23" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.7" />
    <path d="M 12,49 Q 36,59 60,49" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.7" />
    
    <!-- Angled orbital network lines -->
    <ellipse cx="36" cy="36" rx="31" ry="11" transform="rotate(-30 36 36)" fill="none" stroke="#9333ea" stroke-width="1.3" stroke-dasharray="3,1.5" opacity="0.7" />
    <ellipse cx="36" cy="36" rx="31" ry="11" transform="rotate(35 36 36)" fill="none" stroke="#3b82f6" stroke-width="1.3" opacity="0.7" />
    <ellipse cx="36" cy="36" rx="31" ry="11" transform="rotate(75 36 36)" fill="none" stroke="#7c3aed" stroke-width="1.1" stroke-dasharray="2,2" opacity="0.6" />

    <!-- Network Cross-Connections & Data Rays -->
    <line x1="20" y1="18" x2="52" y2="54" stroke="#a855f7" stroke-width="1" opacity="0.7" />
    <line x1="18" y1="48" x2="54" y2="22" stroke="#2563eb" stroke-width="1" opacity="0.7" />
    <line x1="36" y1="5" x2="36" y2="67" stroke="#6d28d9" stroke-width="1.2" opacity="0.6" />

    <!-- Constellation Nodes (Connected Dots) -->
    <circle cx="36" cy="36" r="3.5" fill="#6d28d9" />
    <circle cx="20" cy="18" r="2.8" fill="#7c3aed" />
    <circle cx="52" cy="54" r="2.8" fill="#2563eb" />
    <circle cx="18" cy="48" r="2.5" fill="#0ea5e9" />
    <circle cx="54" cy="22" r="2.5" fill="#9333ea" />
    <circle cx="36" cy="12" r="2.2" fill="#c084fc" />
    <circle cx="36" cy="60" r="2.2" fill="#38bdf8" />
    <circle cx="14" cy="32" r="2" fill="#7c3aed" />
    <circle cx="58" cy="40" r="2" fill="#2563eb" />
  </g>

  <!-- Typography: GlobeCon in Purple, Convergence Solutions in Blue -->
  <g transform="translate(94, 0)">
    <!-- GlobeCon Main Wordmark -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" fill="url(#globeTextGrad)" letter-spacing="-0.8px">
      GlobeCon
    </text>
    
    <!-- Convergence Solutions Subtitle -->
    <text x="2" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', Roboto, 'Helvetica Neue', sans-serif" font-size="14.5" font-weight="700" fill="#2563eb" letter-spacing="0.4px">
      Convergence Solutions
    </text>
  </g>
</svg>
