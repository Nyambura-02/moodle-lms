<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <linearGradient id="globeGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f2942" />
    </linearGradient>
  </defs>
  
  <!-- Stylized Convergence Globe Icon -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="28" fill="#f8fafc" stroke="#0f2942" stroke-width="2.5" />
    <path d="M 6,32 A 26,14 0 0,0 58,32" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="2 1" />
    <path d="M 6,32 A 26,14 0 0,1 58,32" fill="none" stroke="#0f2942" stroke-width="1.8" />
    <ellipse cx="32" cy="32" rx="14" ry="28" fill="none" stroke="url(#globeGradDark)" stroke-width="2" />
    <line x1="32" y1="4" x2="32" y2="60" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="16" cy="20" r="3.5" fill="#0284c7" />
    <circle cx="48" cy="44" r="3.5" fill="#0284c7" />
    <circle cx="32" cy="32" r="4.5" fill="#0f2942" />
  </g>

  <!-- Typography -->
  <text x="85" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0f2942" letter-spacing="0.5">
    Globe<tspan fill="#0284c7">Con</tspan>
  </text>
  <text x="86" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="1.8">
    CONVERGENCE SOLUTIONS
  </text>
