<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 84" width="480" height="84">
  <defs>
    <!-- Dark Mode Glowing Gradients -->
    <linearGradient id="globeDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="meshGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- GlobeCon Dark Mode Spherical Network Mesh Icon -->
  <g transform="translate(10, 6)">
    <!-- Base Subtle Radial Glow -->
    <circle cx="36" cy="36" r="34" fill="rgba(147, 51, 234, 0.18)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
    
    <!-- Outer perimeter ring -->
    <circle cx="36" cy="36" r="31" fill="none" stroke="url(#globeDarkGrad)" stroke-width="2.2" filter="url(#meshGlow)" />
    
    <!-- Vertical ellipses (longitudes) -->
    <ellipse cx="36" cy="36" rx="12" ry="31" fill="none" stroke="#c084fc" stroke-width="1.4" opacity="0.9" />
    <ellipse cx="36" cy="36" rx="22" ry="31" fill="none" stroke="#a855f7" stroke-width="1.3" opacity="0.8" />
    
    <!-- Horizontal latitudinal arcs -->
    <path d="M 6,36 Q 36,22 66,36" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.85" />
    <path d="M 6,36 Q 36,50 66,36" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.85" />
    <path d="M 12,23 Q 36,13 60,23" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.75" />
    <path d="M 12,49 Q 36,59 60,49" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.75" />
    
    <!-- Angled orbital network lines -->
    <ellipse cx="36" cy="36" rx="31" ry="11" transform="rotate(-30 36 36)" fill="none" stroke="#e879f9" stroke-width="1.3" stroke-dasharray="3,1.5" opacity="0.75" />
    <ellipse cx="36" cy="36" rx="31" ry="11" transform="rotate(35 36 36)" fill="none" stroke="#60a5fa" stroke-width="1.3" opacity="0.8" />
    <ellipse cx="36" cy="36" rx="31" ry="11" transform="rotate(75 36 36)" fill="none" stroke="#c084fc" stroke-width="1.1" stroke-dasharray="2,2" opacity="0.65" />

    <!-- Network Cross-Connections & Data Rays -->
    <line x1="20" y1="18" x2="52" y2="54" stroke="#d8b4fe" stroke-width="1.2" opacity="0.8" />
    <line x1="18" y1="48" x2="54" y2="22" stroke="#38bdf8" stroke-width="1.2" opacity="0.8" />
    <line x1="36" y1="5" x2="36" y2="67" stroke="#e879f9" stroke-width="1.2" opacity="0.7" />

    <!-- Constellation Nodes (Connected Dots) -->
    <circle cx="36" cy="36" r="3.8" fill="#ffffff" filter="url(#meshGlow)" />
    <circle cx="20" cy="18" r="3" fill="#e879f9" />
    <circle cx="52" cy="54" r="3" fill="#38bdf8" />
    <circle cx="18" cy="48" r="2.6" fill="#7dd3fc" />
    <circle cx="54" cy="22" r="2.6" fill="#c084fc" />
    <circle cx="36" cy="12" r="2.4" fill="#ffffff" />
    <circle cx="36" cy="60" r="2.4" fill="#67e8f9" />
    <circle cx="14" cy="32" r="2.2" fill="#d8b4fe" />
    <circle cx="58" cy="40" r="2.2" fill="#38bdf8" />
  </g>

  <!-- Typography for Dark Headers -->
  <g transform="translate(94, 0)">
    <!-- GlobeCon Main Wordmark in Crisp White & Violet Accent -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.8px">
      Globe<tspan fill="#c084fc">Con</tspan>
    </text>
    
    <!-- Convergence Solutions in Electric Cyan -->
    <text x="2" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', Roboto, 'Helvetica Neue', sans-serif" font-size="14.5" font-weight="700" fill="#38bdf8" letter-spacing="0.4px">
      Convergence Solutions
    </text>
  </g>
</svg>
